<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Âm cuối">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1726" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Luyện Âm Cuối</title>
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Charis+SIL:wght@400;700&display=swap">
<style>
/* Giao diện kiểu app học ngôn ngữ: nút nổi 3D, màu tươi theo từng bài, chế độ tập trung khi luyện
 * (ẩn thanh tab, một thanh hành động ở đáy đi theo từng bước Nghe → Đọc → Kết quả → Tiếp tục). */
:root{
  --bg:oklch(97.6% 0.012 85); --surface:oklch(100% 0 0); --sunk:oklch(94.6% 0.014 85);
  --ink:oklch(27% 0.035 285); --muted:oklch(50% 0.03 285); --line:oklch(90.5% 0.014 285); --line-deep:oklch(85% 0.02 285);
  --pri:oklch(56% 0.21 290); --pri-deep:oklch(44% 0.2 290); --pri-soft:oklch(94.5% 0.035 290); --pri-ink:oklch(48% 0.2 290); --on-pri:oklch(100% 0 0);
  --sun:oklch(81% 0.16 78); --sun-deep:oklch(67% 0.15 62); --sun-soft:oklch(96% 0.045 88); --sun-ink:oklch(47% 0.11 60);
  --ok:oklch(64% 0.17 150); --ok-deep:oklch(51% 0.15 150); --ok-soft:oklch(95.5% 0.045 150); --ok-ink:oklch(42% 0.12 150);
  --bad:oklch(63% 0.2 25); --bad-deep:oklch(51% 0.19 25); --bad-soft:oklch(95.5% 0.03 25); --bad-ink:oklch(46% 0.17 25);
  --warn:oklch(76% 0.15 68); --warn-deep:oklch(63% 0.14 58); --warn-soft:oklch(96% 0.045 80); --warn-ink:oklch(47% 0.11 58);
  --scrim:oklch(20% 0.03 285 / .45);
  --font-ui:"Nunito",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-ipa:"Charis SIL","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r-s:12px; --r-m:16px; --r-l:22px; --r-xl:28px;
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:oklch(19.5% 0.025 285); --surface:oklch(24.5% 0.03 285); --sunk:oklch(16.5% 0.02 285);
    --ink:oklch(95% 0.01 285); --muted:oklch(73% 0.03 285); --line:oklch(33% 0.035 285); --line-deep:oklch(28% 0.03 285);
    --pri:oklch(62% 0.19 290); --pri-deep:oklch(47% 0.17 290); --pri-soft:oklch(31% 0.07 290); --pri-ink:oklch(80% 0.12 290); --on-pri:oklch(100% 0 0);
    --sun:oklch(80% 0.15 78); --sun-deep:oklch(62% 0.14 62); --sun-soft:oklch(31% 0.06 78); --sun-ink:oklch(86% 0.12 82);
    --ok:oklch(68% 0.17 150); --ok-deep:oklch(52% 0.15 150); --ok-soft:oklch(29% 0.06 150); --ok-ink:oklch(84% 0.14 150);
    --bad:oklch(66% 0.19 25); --bad-deep:oklch(50% 0.18 25); --bad-soft:oklch(29% 0.07 25); --bad-ink:oklch(84% 0.11 25);
    --warn:oklch(78% 0.14 70); --warn-deep:oklch(60% 0.13 60); --warn-soft:oklch(30% 0.06 70); --warn-ink:oklch(86% 0.11 78);
    --scrim:oklch(5% 0.02 285 / .6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:oklch(19.5% 0.025 285); --surface:oklch(24.5% 0.03 285); --sunk:oklch(16.5% 0.02 285);
  --ink:oklch(95% 0.01 285); --muted:oklch(73% 0.03 285); --line:oklch(33% 0.035 285); --line-deep:oklch(28% 0.03 285);
  --pri:oklch(62% 0.19 290); --pri-deep:oklch(47% 0.17 290); --pri-soft:oklch(31% 0.07 290); --pri-ink:oklch(80% 0.12 290); --on-pri:oklch(100% 0 0);
  --sun:oklch(80% 0.15 78); --sun-deep:oklch(62% 0.14 62); --sun-soft:oklch(31% 0.06 78); --sun-ink:oklch(86% 0.12 82);
  --ok:oklch(68% 0.17 150); --ok-deep:oklch(52% 0.15 150); --ok-soft:oklch(29% 0.06 150); --ok-ink:oklch(84% 0.14 150);
  --bad:oklch(66% 0.19 25); --bad-deep:oklch(50% 0.18 25); --bad-soft:oklch(29% 0.07 25); --bad-ink:oklch(84% 0.11 25);
  --warn:oklch(78% 0.14 70); --warn-deep:oklch(60% 0.13 60); --warn-soft:oklch(30% 0.06 70); --warn-ink:oklch(86% 0.11 78);
  --scrim:oklch(5% 0.02 285 / .6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
html{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-weight:600;font-size:clamp(15px,4vw,17px);line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:0;background:none;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
svg{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 12px) var(--gr) calc(var(--tabh) + var(--safe-b) + 28px) var(--gl);display:flex;flex-direction:column;gap:18px}
body.focus .app{padding-bottom:calc(var(--footh,0px) + 28px)}
body.focus .top, body.focus .tabs, body.focus #notice{display:none}

/* ---------- Nút nổi 3D ---------- */
.b3{--c:var(--pri);--d:var(--pri-deep);--t:var(--on-pri);position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 20px;border-radius:var(--r-m);background:var(--c);color:var(--t);box-shadow:0 4px 0 var(--d);font-weight:900;font-size:1.06em;letter-spacing:.01em;text-align:center;transition:transform 80ms var(--ease),box-shadow 80ms var(--ease),filter 120ms;white-space:nowrap;min-width:0}
.b3 svg{width:22px;height:22px}
.b3 span{overflow:hidden;text-overflow:ellipsis}
.b3:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.b3:disabled{filter:grayscale(1);opacity:.5}
.b3.ghost{--c:var(--surface);--d:var(--line-deep);--t:var(--ink);border:2px solid var(--line)}
.b3.ok{--c:var(--ok);--d:var(--ok-deep);--t:#fff}
.b3.bad{--c:var(--bad);--d:var(--bad-deep);--t:#fff}
.b3.warn{--c:var(--warn);--d:var(--warn-deep);--t:oklch(25% 0.05 60)}
.b3.sun{--c:var(--sun);--d:var(--sun-deep);--t:oklch(25% 0.05 60)}
.b3.live{--c:var(--bad);--d:var(--bad-deep);--t:#fff}
.b3.wide{width:100%}
.b3.sq{padding:0;width:56px;flex:none}
.b3.locked{--t:var(--muted);border-style:dashed}
@media (hover:hover){ .b3:hover:not(:disabled){filter:brightness(1.05)} }
@media (prefers-reduced-motion: no-preference){ .b3.live{animation:pulse 1.1s ease-in-out infinite} }
@keyframes pulse{50%{filter:brightness(1.15)}}

/* ---------- Đầu trang ---------- */
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.logo .mk{width:36px;height:36px;border-radius:11px;background:var(--pri);box-shadow:0 3px 0 var(--pri-deep);display:grid;place-items:center;color:#fff}
.logo .mk svg{width:22px;height:22px}
.logo h1{margin:0;font-size:1.3em;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.chipc{display:flex;align-items:center;gap:4px;font-weight:900;font-size:.95em;padding:0 4px;min-height:40px;font-variant-numeric:tabular-nums}
.chipc svg{width:24px;height:24px}
.chipc.fire{color:var(--sun-deep)} .chipc.fire.off{color:var(--muted);filter:grayscale(1);opacity:.7}
.chipc.star{color:var(--pri-ink)}
.icon-btn{width:44px;height:44px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:24px;height:24px}

.notice{background:var(--pri-soft);border-radius:var(--r-m);padding:12px 14px;font-size:.9em;display:flex;gap:10px;align-items:flex-start}
.notice p{margin:0;flex:1;min-width:0}
.notice button{color:var(--pri-ink);font-weight:800;min-height:32px;padding:0 4px}

h2.sec{margin:10px 0 -4px;font-size:1.15em;font-weight:900}

/* ---------- Trang chính ---------- */
.goal{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);box-shadow:0 4px 0 var(--line);padding:18px;display:flex;flex-direction:column;gap:16px}
.goal .gtop{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--sunk)} .ring .fl{stroke:var(--sun);transition:stroke-dashoffset .6s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.2em;font-weight:900;font-variant-numeric:tabular-nums}
.ring.full .fl{stroke:var(--ok)}
.goal h3{margin:0;font-size:1.1em;font-weight:900}
.goal p{margin:2px 0 0;color:var(--muted);font-size:.92em}

.tiles{display:flex;flex-direction:column;gap:12px}
.tile{--h:290;display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);box-shadow:0 4px 0 var(--line);padding:14px;transition:transform 80ms var(--ease),box-shadow 80ms var(--ease)}
.tile:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.tile .ic{width:60px;height:60px;border-radius:50%;background:oklch(62% 0.17 var(--h));box-shadow:0 4px 0 oklch(49% 0.16 var(--h));color:#fff;display:grid;place-items:center;font-weight:900;font-size:1.05em;letter-spacing:-.02em;line-height:1;text-align:center;padding:4px}
.tile .ic svg{width:28px;height:28px}
.tile .nm{display:block;font-weight:900;font-size:1.05em;line-height:1.25}
.tile .ds{display:block;color:var(--muted);font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pb{display:block;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:8px}
.tile .pb i{display:block;height:100%;border-radius:5px;background:oklch(68% 0.16 var(--h));min-width:0}
.tile .ct{font-weight:900;color:var(--muted);font-size:.9em;font-variant-numeric:tabular-nums}
.tile .ct.done{color:var(--sun-deep)} .tile .ct svg{width:28px;height:28px;display:block}
.tile.review{background:var(--warn-soft);border-color:transparent;box-shadow:0 4px 0 var(--warn)}
.tile.review:active{box-shadow:0 0 0 var(--warn)}
.tile.review .ic{background:var(--warn);box-shadow:0 4px 0 var(--warn-deep);color:oklch(25% 0.05 60)}

/* ---------- Thanh trên ở chế độ tập trung ---------- */
.fbar{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:12px;margin:calc(-12px - var(--safe-t)) calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:calc(var(--safe-t) + 10px) var(--gr) 10px var(--gl)}
.x{width:44px;height:44px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:26px;height:26px}
.prog{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--ok);box-shadow:inset 0 4px 0 -1px oklch(100% 0 0 / .3);transition:width .4s var(--ease)}
.fbar .cnt{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.95em;min-width:3.2em;text-align:right}
.fbar .ttl{flex:1;font-weight:900;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Thẻ từ ---------- */
.lead{margin:0;color:var(--muted);font-size:.95em;font-weight:700}
.lead b{color:var(--ink);font-weight:900}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);box-shadow:0 4px 0 var(--line);padding:16px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y;min-width:0;text-align:center}
.card .ctop{align-self:stretch;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:36px}
.tag{font-weight:800;font-size:.85em;background:var(--pri-soft);color:var(--pri-ink);padding:4px 12px;border-radius:999px;white-space:nowrap}
.tag .ip{font-family:var(--font-ipa);font-weight:700}
.badge{font-size:.8em;font-weight:900;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.badge svg{width:14px;height:14px}
.badge.ok{background:var(--ok-soft);color:var(--ok-ink)}
.badge.weak{background:var(--warn-soft);color:var(--warn-ink)}
.badge.new{background:var(--sunk);color:var(--muted)}
.word{font-weight:900;font-size:clamp(50px,17vw,84px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0;margin-top:4px}
.tail{color:var(--pri);text-decoration:underline;text-decoration-thickness:.1em;text-underline-offset:.14em;text-decoration-skip-ink:none}
.ipa{font-family:var(--font-ipa);font-size:1.35em;color:var(--muted);margin-top:-4px}
.ipa .tail{text-decoration-thickness:2px;text-underline-offset:4px}
.speak{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 2px}
.spk{width:76px;height:76px;border-radius:24px;background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--pri-deep);display:grid;place-items:center;transition:transform 80ms var(--ease),box-shadow 80ms var(--ease)}
.spk svg{width:38px;height:38px}
.spk:active{transform:translateY(5px);box-shadow:0 0 0 var(--pri-deep)}
.spk.sm{width:56px;height:56px;border-radius:18px;background:var(--surface);color:var(--pri-ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line-deep)}
.spk.sm svg{width:30px;height:30px}
.spk.sm:active{box-shadow:0 0 0 var(--line-deep);transform:translateY(4px)}
.tip{align-self:stretch;display:flex;gap:10px;align-items:flex-start;text-align:left;margin:4px 0 0;font-size:.95em;background:var(--sun-soft);border-radius:var(--r-m);padding:12px 14px}
.tip svg{width:22px;height:22px;color:var(--sun-deep);margin-top:1px}
.pair{align-self:stretch;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font-size:.9em;color:var(--muted);font-weight:700}
.wbtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;color:var(--ink);transition:transform 80ms var(--ease),box-shadow 80ms var(--ease)}
.wbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.wbtn svg{width:16px;height:16px;color:var(--pri)}
.wbtn .ip{font-family:var(--font-ipa);font-weight:400;color:var(--muted)}
.prev{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-weight:800;font-size:.85em;min-height:36px;padding-right:6px}
.prev svg{width:18px;height:18px}
.swipe-hint{margin:-4px 0 0;text-align:center;font-size:.82em;color:var(--muted);font-weight:700}

/* ---------- Thanh hành động đáy ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);padding:12px var(--gr) calc(12px + var(--safe-b)) var(--gl);transition:background-color .2s}
.foot .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.foot .acts{display:flex;gap:10px}
.foot .acts .main{flex:1}
.foot.fb-ok{background:var(--ok-soft);border-top-color:transparent}
.foot.fb-bad{background:var(--bad-soft);border-top-color:transparent}
.foot.fb-warn{background:var(--warn-soft);border-top-color:transparent}
.fbm{display:flex;gap:12px;align-items:flex-start}
.fbm .fi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.fbm .fi svg{width:26px;height:26px}
.fb-ok .fi{background:var(--ok)} .fb-bad .fi{background:var(--bad)} .fb-warn .fi{background:var(--warn);color:oklch(25% 0.05 60)}
.fbm b{display:block;font-size:1.2em;font-weight:900;line-height:1.25}
.fb-ok .fbm b{color:var(--ok-ink)} .fb-bad .fbm b{color:var(--bad-ink)} .fb-warn .fbm b{color:var(--warn-ink)}
.fbm p{margin:2px 0 0;font-size:.92em}
.fbm .heard{font-family:var(--font-ipa);font-weight:700}
@media (prefers-reduced-motion: no-preference){ .foot.slide .in{animation:up .28s var(--ease)} }
@keyframes up{from{transform:translateY(16px);opacity:0}}

/* ---------- Kết quả, ghi âm ---------- */
.result:empty{display:none}
.verdict{border-radius:var(--r-m);padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--sunk);text-align:left}
.verdict b{font-weight:900}
.verdict p{margin:0;font-size:.92em}
.verdict .heard{font-family:var(--font-ipa);font-size:1.08em;overflow-wrap:anywhere}
.verdict.ok{background:var(--ok-soft)} .verdict.ok b{color:var(--ok-ink)}
.verdict.warn{background:var(--warn-soft)} .verdict.warn b{color:var(--warn-ink)}
.verdict.bad{background:var(--bad-soft)} .verdict.bad b{color:var(--bad-ink)}
.verdict.info{background:var(--pri-soft)}
.verdict .pill{align-self:flex-start;margin-top:6px;text-decoration:none}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:4%;background:var(--bad);border-radius:6px;transition:width 80ms linear}
.recout{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-m);padding:12px;text-align:left}
.recout p{margin:0;font-size:.92em}
.recout audio{width:100%;height:40px}
.recout .self{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9em;color:var(--muted);font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:.88em}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);border-radius:999px;padding:0 16px;font-size:.92em;font-weight:900;min-height:44px;color:var(--ink);transition:transform 80ms var(--ease),box-shadow 80ms var(--ease)}
.pill:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.pill.ok{color:var(--ok-ink)} .pill.bad{color:var(--warn-ink)} .pill.danger{color:var(--bad-ink)}
.pill.pri{background:var(--pri);color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--pri-deep)}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tok{font-weight:800;font-size:1.02em;padding:2px 8px;border-radius:8px;background:var(--surface)}
.tok.ok{color:var(--ok-ink)}
.tok.miss{color:var(--bad-ink);text-decoration:line-through;text-decoration-thickness:2px}
.tok.near{color:var(--warn-ink)}
.tok.focus{box-shadow:inset 0 -3px 0 currentColor}

/* Bộ nút công cụ (câu luyện, tự do) */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tools.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tools .b3{flex-direction:column;gap:2px;min-height:64px;padding:4px;font-size:.8em;font-weight:900}
.tools .b3 svg{width:24px;height:24px}
.tools.compact .b3{min-height:52px;flex-direction:row;gap:6px;font-size:.78em}
.tools.compact .b3 svg{width:18px;height:18px}
@media (max-width:359px){ .tools.compact .b3 svg{display:none} }

/* ---------- Câu luyện ---------- */
.sentences{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sitem{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);box-shadow:0 4px 0 var(--line);padding:12px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.sitem.open{border-color:var(--pri);box-shadow:0 4px 0 var(--pri-deep)}
.shead{display:flex;align-items:flex-start;gap:12px}
.splay{flex:none;width:48px;height:48px;border-radius:15px;background:var(--pri);color:#fff;box-shadow:0 3px 0 var(--pri-deep);display:grid;place-items:center;transition:transform 80ms var(--ease),box-shadow 80ms var(--ease)}
.splay:active{transform:translateY(3px);box-shadow:0 0 0 var(--pri-deep)}
.splay svg{width:22px;height:22px}
.stext{flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px;text-align:left;padding-top:8px}
.chev{flex:none;color:var(--muted);margin-top:4px;transition:transform .2s var(--ease)}
.chev svg{width:20px;height:20px;display:block}
.sitem.open .chev{transform:rotate(90deg);color:var(--pri)}
.sent{flex:1;min-width:0;font-weight:800;font-size:1.15em;line-height:1.4;margin:0;overflow-wrap:anywhere}
.sent .tail{text-decoration-thickness:3px;text-underline-offset:4px}

/* ---------- Hoàn thành bài, màn chào ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:12px 0 4px}
.medal{width:120px;height:120px;border-radius:50%;background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);display:grid;place-items:center;color:#fff}
.medal svg{width:64px;height:64px}
.medal.pri{background:var(--pri);box-shadow:0 6px 0 var(--pri-deep)}
.hero h2{margin:6px 0 0;font-size:1.6em;font-weight:900;line-height:1.2}
.hero p{margin:0;color:var(--muted);max-width:30em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-self:stretch}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats div{border:2px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface);text-align:center}
.stats span{display:block;font-size:.75em;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:4px 4px;color:#fff;background:var(--c,var(--pri))}
.stats b{display:block;font-size:1.45em;font-weight:900;padding:6px 4px 8px;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:12px;align-self:stretch}
.linkish{color:var(--pri-ink);font-weight:900;min-height:44px}

/* ---------- Luyện tai ---------- */
.qtitle{margin:4px 0 0;font-size:1.35em;font-weight:900;line-height:1.25}
.qplay{display:flex;justify-content:center;align-items:center;gap:16px;padding:12px 0}
.qplay .spk{width:112px;height:112px;border-radius:32px;box-shadow:0 6px 0 var(--pri-deep)}
.qplay .spk svg{width:52px;height:52px}
.qplay .spk.sm{width:64px;height:64px;border-radius:20px}
.qplay .spk.sm svg{width:32px;height:32px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{min-height:clamp(92px,26vw,116px);border-radius:var(--r-l);border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;min-width:0;transition:transform 80ms var(--ease),box-shadow 80ms var(--ease)}
.choice:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.choice .cw{font-weight:900;font-size:clamp(24px,7.5vw,32px);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.choice .ci{font-family:var(--font-ipa);color:var(--muted);font-size:.95em}
.choice.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.choice.right .cw{color:var(--ok-ink)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.choice.wrong .cw{color:var(--bad-ink)}
.choice.dim{opacity:.55}
.panelc{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);box-shadow:0 4px 0 var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* ---------- Tự do ---------- */
textarea{width:100%;min-height:112px;border-radius:var(--r-m);border:2px solid var(--line);background:var(--bg);padding:12px 14px;font-weight:800;font-size:max(16px,1.15em);line-height:1.4;resize:vertical}
textarea:focus{outline:none;border-color:var(--pri)}
.samples{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.samples::-webkit-scrollbar{display:none}
.samples button{flex:none;scroll-snap-align:start;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);border-radius:999px;min-height:42px;padding:0 14px;font-weight:800;font-size:.92em;white-space:nowrap}
.samples button:active{transform:translateY(3px);box-shadow:none}

/* ---------- Quy tắc ---------- */
.rules{display:flex;flex-direction:column;gap:14px}
.rule{--h:290;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-l);box-shadow:0 4px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rule h3{margin:0;font-size:1.1em;font-weight:900;display:flex;align-items:center;gap:10px}
.rule h3 i{width:34px;height:34px;border-radius:11px;background:oklch(62% 0.17 var(--h));color:#fff;display:grid;place-items:center;font-style:normal;font-size:.8em;font-weight:900;flex:none}
.rule p{margin:0;font-size:.95em}
.rule ol{margin:0;padding-left:22px;font-size:.95em;display:flex;flex-direction:column;gap:8px}
.rtab{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:4px 12px;padding-top:10px;border-top:2px dashed var(--line)}
.rrow:first-child{border-top:0;padding-top:0}
.rrow .s{font-family:var(--font-ipa);font-weight:700;font-size:1.15em;color:var(--pri-ink);line-height:1.3}
.rrow .when{font-size:.92em}
.rrow .ex{grid-column:2}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{border:2px solid var(--line);background:var(--bg);border-radius:10px;min-height:38px;padding:0 10px;font-weight:800;font-size:.95em}
.ex button:active{background:var(--pri-soft)}

/* ---------- Thanh tab ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) var(--safe-b) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--tabh)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:900;color:var(--muted)}
.tabs .ti{display:grid;place-items:center;width:52px;height:32px;border-radius:12px;transition:background-color .15s}
.tabs svg{width:26px;height:26px}
.tabs button[aria-current="page"]{color:var(--pri-ink)}
.tabs button[aria-current="page"] .ti{background:var(--pri-soft)}

/* ---------- Bảng cài đặt ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px var(--gr) calc(20px + var(--safe-b)) var(--gl);display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow:auto}
@media (prefers-reduced-motion: no-preference){ .sheet:not([hidden]){animation:up .25s var(--ease)} }
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet .sh{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font-size:1.2em;font-weight:900}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:.85em;font-weight:900;color:var(--muted)}
.field select{width:100%;min-height:48px;border-radius:var(--r-s);border:2px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;font-weight:700}
.field input[type=range]{width:100%;min-height:32px;accent-color:var(--pri)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;min-height:44px}
.switch input{width:24px;height:24px;accent-color:var(--pri)}
.hint{margin:0;font-size:.88em;color:var(--muted)}

/* ---------- Thông báo, pháo giấy ---------- */
.toast{position:fixed;left:var(--gl);right:var(--gr);bottom:calc(var(--tabh) + var(--safe-b) + 12px);z-index:50;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:var(--r-m);padding:12px 16px;font-size:.92em;display:flex;gap:12px;align-items:flex-start;box-shadow:0 8px 24px oklch(0% 0 0 / .2)}
body.focus .toast{bottom:calc(var(--footh,0px) + 12px)}
.toast p{margin:0;flex:1;min-width:0}
.toast button{color:inherit;font-weight:900;min-height:28px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;left:50%;top:42%;width:10px;height:14px;border-radius:3px;animation:cf 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){ *{transition-duration:0ms!important;animation:none!important} .confetti{display:none} }
@media (prefers-reduced-motion: no-preference){ .pop{animation:pop .35s var(--ease)} }
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}}

.b3.sq span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pnl{display:flex;flex-direction:column;gap:12px}
.leadrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:-6px}
.leadrow .linkish{flex:none;min-height:28px;font-size:.92em}
.fl{font-weight:900;font-size:.95em}
.steps{list-style:none;margin:0;padding:0;display:flex;justify-content:center;gap:6px 14px;flex-wrap:wrap;font-size:.8em;font-weight:900;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:6px}
.steps li span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:.85em}
.steps li.on{color:var(--pri-ink)} .steps li.on span{background:var(--pri);color:#fff}
.steps li.dn{color:var(--ok-ink)} .steps li.dn span{background:var(--ok);color:#fff}
@media (max-width:359px){ .xl{display:none} }
@media (max-width:359px){ .steps{font-size:.72em;gap:4px 8px} }

let keepTimer = 0;
function audioOn(){ if (!keepAlive) return; clearTimeout(keepTimer); if (keepAlive.paused) { try { const p = keepAlive.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} } }
function audioOff(now){ if (!keepAlive) return; clearTimeout(keepTimer); if (now) keepAlive.pause(); else keepTimer = setTimeout(() => keepAlive.pause(), 4000); }

/* Giọng "vui" của iOS (Bubbles, Zarvox…) đọc sai hoặc không ra tiếng, không dùng để luyện phát âm. */
const NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/i;
function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name));
  const sel = $("#voice"); if (!sel) return;
  const order = v => (/en[-_]US/i.test(v.lang) ? 0 : /en[-_]GB/i.test(v.lang) ? 1 : 2);
  voices.sort((a,b) => order(a)-order(b) || a.name.localeCompare(b.name));
  sel.innerHTML = voices.length ? voices.map(v => `<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("") : '<option value="">Mặc định của máy</option>';
  if (S.voice && voices.some(v => v.name === S.voice)) sel.value = S.voice;
  else { const pref = voices.find(v => /samantha/i.test(v.name)) || voices.find(v => /en[-_]US/i.test(v.lang)); if (pref) sel.value = pref.name; }
}
if (synth) { loadVoices(); if (synth.addEventListener) synth.addEventListener("voiceschanged", loadVoices); else synth.onvoiceschanged = loadVoices; }
function pickVoice(){ const name = ($("#voice") || {}).value || S.voice; return voices.find(v => v.name === name) || voices.find(v => /en[-_]US/i.test(v.lang)) || null; }
function say(text, rate){
  return new Promise(res => {
    if (!synth || !text) { if (!synth) toast("Trình duyệt này không có giọng đọc. Hãy mở bằng Safari.", 5000); return res(); }
    if (synth.speaking || synth.pending) synth.cancel();
    if (synth.paused) synth.resume();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang.replace("_","-"); } else u.lang = "en-US";
    u.rate = rate || S.rate; u.volume = 1;
    curUtter = u; // giữ tham chiếu để trình duyệt không thu hồi giữa chừng
    let done = false, started = false; lastStarted = false;
    const fin = () => { if (!done) { done = true; if (curUtter === u) audioOff(); res(); } };
    u.onstart = () => { started = true; ttsOk = true; lastStarted = true; };
    u.onend = fin; u.onerror = fin;
    audioOn(); // phải gọi trong cùng lần chạm, trước speak()
    synth.speak(u); // gọi trực tiếp, không trì hoãn
    setTimeout(() => {
      if (started || done || ttsWarned) return;
      ttsWarned = true;
      if (synth.speaking) synth.cancel(); // iOS đôi khi kẹt hàng đợi: xóa để lần bấm sau phát được
      toast("Chưa phát được giọng đọc. Bấm <b>Nghe</b> lại lần nữa. Nếu vẫn im: tăng âm lượng, tắt chế độ <b>Im lặng</b>, rồi tải lại trang.", 9000);
    }, 1500);
    setTimeout(fin, 8000 + text.length * 120);
  });
}

/* ---------- Ghi âm ---------- */
const REG = {}; // key -> {text, item, focus, url}
let recState = null;
function micHelp(err){
  const name = err && (err.name || err.code);
  if (inFrame) return "Trang đang mở bên trong Claude nên micro bị khóa. Hãy mở bản cài trên Safari để ghi âm và chấm điểm.";
  if (name === "NotAllowedError" || name === "not-allowed" || name === "service-not-allowed")
    return "Chưa có quyền. Vào Cài đặt → Safari → Micro → Cho phép. Với nút Chấm, bật thêm Cài đặt → Cài đặt chung → Bàn phím → Bật Đọc chính tả.";
  return "Thử mở trang trực tiếp trong Safari (iOS 14.5 trở lên).";
}
function verdict(cls, title, body){ return `<div class="verdict ${cls}"><b>${title}</b>${body ? `<p>${body}</p>` : ""}</div>`; }
function setRes(key, html){
  const el = document.getElementById("res-"+key); if (!el) return;
  el.innerHTML = html;
  if (html && el.scrollIntoView) { const r = el.getBoundingClientRect(); const limit = window.innerHeight - (document.body.classList.contains("focus") ? (parseFloat(document.body.style.getPropertyValue("--footh")) || 0) + 16 : 90); if (r.bottom > limit || r.top < 0) el.scrollIntoView({block:"nearest", behavior:"smooth"}); }
}
function setBtn(key, act, live, label, icon){
  document.querySelectorAll(`[data-act="${act}"][data-key="${key}"]`).forEach(b => {
    b.classList.toggle("live", live); b.setAttribute("aria-busy", String(live)); b.innerHTML = icon + `<span>${label}</span>`;
  });
}
async function toggleRec(key){
  if (recState) { const same = recState.key === key; stopRec(); if (same) return; }
  stopRecog();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { setRes(key, verdict("bad","Không ghi âm được ở đây", micHelp())); return; }
  if (synth) synth.cancel();
  audioOff(true);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (err) { setRes(key, verdict("bad","Chưa dùng được micro", micHelp(err))); return; }
  const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  let rec;
  try { rec = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined); } catch (e) { rec = new MediaRecorder(stream); }
  const st = {key, rec, stream, chunks:[], t0:Date.now()};
  recState = st;
  rec.ondataavailable = e => { if (e.data && e.data.size) st.chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (st.ctx) st.ctx.close().catch(()=>{});
    cancelAnimationFrame(st.raf);
    const blob = new Blob(st.chunks, {type: rec.mimeType || mime || "audio/mp4"});
    const r = REG[key]; if (!r) return;
    if (r.url) URL.revokeObjectURL(r.url);
    r.url = URL.createObjectURL(blob);
    const secs = ((Date.now()-st.t0)/1000).toFixed(1);
    setRes(key, `<div class="recout">
      <audio id="aud-${key}" src="${r.url}" controls playsinline preload="auto"></audio>
      <div class="row"><button class="pill" data-act="compare" data-key="${key}">Mẫu rồi tới mình</button><span class="muted">${secs}s</span></div>
      ${r.item ? `<div class="self"><span>Tự chấm:</span><button class="pill ok" data-act="rate" data-v="1" data-key="${key}">Chuẩn rồi</button><button class="pill bad" data-act="rate" data-v="0" data-key="${key}">Chưa chuẩn</button></div>` : ""}
    </div>`);
  };
  rec.start();
  setBtn(key, "rec", true, "Dừng", ICON.stop);
  setRes(key, `<div class="recout"><div class="meter"><i id="lvl-${key}"></i></div><p>Đang ghi âm. Đọc rõ âm cuối rồi bấm <b>Dừng</b>.</p></div>`);
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    st.ctx = new AC(); const src = st.ctx.createMediaStreamSource(stream); const an = st.ctx.createAnalyser(); an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    const loop = () => { an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) { const x = (v-128)/128; sum += x*x; }
      const lv = Math.min(100, Math.sqrt(sum/buf.length)*400); const el = document.getElementById("lvl-"+key); if (el) el.style.width = Math.max(4,lv)+"%"; st.raf = requestAnimationFrame(loop); };
    loop();
  } catch (e) {}
  st.timer = setTimeout(() => { if (recState === st) stopRec(); }, 12000);
}
function stopRec(){
  const st = recState; if (!st) return; recState = null; clearTimeout(st.timer);
  setBtn(st.key, "rec", false, "Ghi âm", ICON.mic);
  try { st.rec.state !== "inactive" ? st.rec.stop() : st.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
}

/* ---------- Chấm bằng nhận dạng giọng nói ---------- */
let recog = null;
function stopRecog(){ if (recog) { try { recog.abort(); } catch (e) {} recog = null; } }
function recognize(onStart){
  return new Promise((res, rej) => {
    if (!Recog) return rej({code:"unsupported"});
    const r = new Recog(); recog = r;
    r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 3; r.continuous = false;
    let got = false;
    r.onstart = onStart;
    r.onresult = e => { got = true; const alts = Array.from(e.results[0] || []).map(a => a.transcript); res(alts); try { r.stop(); } catch (x) {} };
    r.onerror = e => { if (!got) { got = true; rej({code:e.error}); } };
    r.onend = () => { if (recog === r) recog = null; if (!got) rej({code:"no-speech"}); };
    try { r.start(); } catch (e) { rej({code:"start-failed"}); }
  });
}
function checkDone(key){ if (key === "w") renderFoot(); else setBtn(key, "check", false, "Chấm", ICON.check); }
async function check(key){
  const r = REG[key]; if (!r) return;
  if (recog) { try { recog.stop(); } catch (e) {} return; }
  if (recState) stopRec();
  if (synth) synth.cancel();
  audioOff(true);
  const text = key === "free" ? ($("#free-text").value || "").trim() : r.text;
  if (!text) { setRes(key, verdict("warn","Chưa có câu để chấm","Gõ một câu tiếng Anh vào ô phía trên.")); return; }
  setBtn(key, "check", true, "Đang nghe…", ICON.stop);
  setRes(key, verdict("", "Đang chuẩn bị micro…"));
  let alts;
  try { alts = await recognize(() => setRes(key, verdict("", "Nói ngay bây giờ", "Đọc to, rõ, nhấn vào âm cuối."))); }
  catch (e) {
    checkDone(key);
    const c = e && e.code;
    if (c === "no-speech" || c === "aborted") setRes(key, verdict("warn","Không nghe thấy gì","Bấm Chấm rồi nói ngay, đưa điện thoại gần miệng hơn."));
    else if (c === "unsupported") setRes(key, verdict("bad","Không chấm được trong trình duyệt này", inFrame ? micHelp() : "Dùng Safari trên iPhone (iOS 14.5+). Nếu đang mở từ Màn hình chính mà không chạy, thử mở bằng Safari."));
    else setRes(key, verdict("bad","Chưa dùng được nhận dạng giọng nói", micHelp(e)));
    return;
  }
  checkDone(key);
  if (r.item) judgeWord(key, r.item, alts); else judgeText(key, text, alts, r.focus);
}
function judgeWord(key, item, alts){
  const top = alts[0] || ""; const heard = new Set(tok(top));
  const okForms = [item.w].concat(item.hom || []);
  const tip = esc(TIPS[item.t] || "");
  let fb, ok = false;
  if (okForms.some(x => heard.has(x))) { ok = true; fb = {cls:"ok", title:praise(), body:"Âm cuối "+esc(endLabel(item))+" đã ra rõ."}; }
  else if (item.pair && heard.has(item.pair)) fb = {cls:"bad", title:"Nghe thành “"+esc(item.pair)+"”", body:"Âm cuối bị lẫn. "+tip};
  else if (item.base && heard.has(item.base)) fb = {cls:"bad", title:"Thiếu âm cuối "+esc(endLabel(item)), body:"Máy chỉ nghe được “"+esc(item.base)+"”. "+tip};
  else if (alts.slice(1).some(a => okForms.some(x => tok(a).includes(x)))) fb = {cls:"warn", title:"Gần đúng rồi!", body:"Máy còn phân vân. Đọc chậm hơn và giữ âm cuối lâu hơn một chút."};
  else fb = {cls:"warn", title:"Chưa khớp", body:"Thử lại chậm hơn. Từ đứng một mình khó nhận dạng, có thể luyện thêm trong câu."};
  fb.heard = top;
  mark(item.w, ok); refreshBadge(item.w);
  if (key === "w") showFeedback(fb);
  else setRes(key, verdict(fb.cls, fb.title, fb.body + ` Máy nghe: <span class="heard">“${esc(top)}”</span>`));
}
function judgeText(key, text, alts, focus){
  const want = tok(text); const heard = new Set(tok(alts[0] || ""));
  const fset = new Set((focus || []).map(f => f.toLowerCase()));
  let okN = 0, focusMiss = 0;
  const chips = want.map(w => {
    const f = fset.has(w) ? " focus" : "";
    if (heard.has(w)) { okN++; return `<span class="tok ok${f}">${esc(w)}</span>`; }
    if (f) focusMiss++;
    const bases = [w.replace(/es$/,""), w.replace(/s$/,""), w.replace(/ed$/,""), w.replace(/d$/,"")].filter(b => b && b !== w);
    const near = bases.find(b => heard.has(b));
    return near ? `<span class="tok near${f}" title="nghe thành ${esc(near)}">${esc(w)} → ${esc(near)}</span>` : `<span class="tok miss${f}">${esc(w)}</span>`;
  }).join("");
  const all = okN === want.length;
  const cls = all ? "ok" : (focusMiss === 0 && okN/want.length >= .7) ? "warn" : "bad";
  const title = all ? "Khớp toàn bộ câu" : `Khớp ${okN}/${want.length} từ`;
  setRes(key, `<div class="verdict ${cls}"><b>${title}</b><div class="tokens">${chips}</div><p>Máy nghe: <span class="heard">“${esc(alts[0]||"")}”</span></p><p class="muted">Xanh: khớp · cam: thiếu đuôi · đỏ: không nghe ra · gạch chân: từ cần chú ý âm cuối</p></div>`);
  touchDay(); save(); updateHeader();
  sfx(all ? "ok" : "bad");
}

/* ---------- Trạng thái giao diện ---------- */
const st = {tab:"practice", set:null, i:0, phase:"word", heard:false, fb:null, sess:{ok:0,t:0}, review:[]};
const Q = {on:false, i:0, n:10, score:0, items:[], cur:null, answered:false, picked:null};
const PRAISE = ["Tuyệt vời!","Chuẩn luôn!","Hay quá!","Rất tốt!","Xuất sắc!","Đỉnh thật!"];
const praise = () => PRAISE[Math.floor(Math.random()*PRAISE.length)];
const slowRate = () => Math.max(0.45, S.rate - 0.4);

function tools(key, noSay, compact){
  const t = (act, cls, icon, label, ok) => ok === false
    ? `<button class="b3 ghost locked" data-act="${act}" data-key="${key}" aria-disabled="true" aria-label="${label} (cần mở bằng Safari)">${ICON.lock}<span>${label}</span></button>`
    : `<button class="b3 ${cls}" data-act="${act}" data-key="${key}">${icon}<span>${label}</span></button>`;
  return `<div class="tools${noSay ? " three" : ""}${compact ? " compact" : ""}">`
    + (noSay ? "" : t("say", "", ICON.play, "Nghe"))
    + t("slow", "ghost", ICON.turtle, "Chậm")
    + t("rec", "ghost", ICON.mic, "Ghi âm", CAN_MIC)

}
function panel(key, compact, noSay){
  return `<div class="pnl">${tools(key, noSay, compact)}<div class="result" id="res-${key}" aria-live="polite"></div></div>`;
}
function updateHeader(){
  const n = streak(), m = ALL.filter(x => status(x.w) === "ok").length;
  const a = $("#c-streak"); a.innerHTML = ICON.fire + `<span>${n}</span>`; a.classList.toggle("off", !n); a.setAttribute("aria-label", `Chuỗi ${n} ngày`);
  const b = $("#c-star"); b.innerHTML = ICON.star + `<span>${m}</span>`; b.setAttribute("aria-label", `${m}/${ALL.length} từ đã thuộc`);
}
function renderNotice(){
  let html = "";
  const home = st.tab === "practice" && !st.set;
  if (home && inFrame && !S.hideFrame) html = `<div class="notice"><p><b>Đang mở trong Claude.</b> Nghe mẫu và luyện tai dùng được ngay. Ghi âm và Chấm cần micro, chỉ chạy khi mở app bằng Safari.</p><button data-act="hide-notice" data-v="hideFrame">Ẩn</button></div>`;
  else if (home && !inFrame && isIOS && !isStandalone && !S.hideInstall) html = `<div class="notice"><p><b>Cài như app:</b> nút Chia sẻ của Safari → <b>Thêm vào MH chính</b>.</p><button data-act="hide-notice" data-v="hideInstall">Ẩn</button></div>`;
  $("#notice").innerHTML = html;
}

/* ---------- Trang chính ---------- */
const setDone = s => s.words.every(x => status(x.w) === "ok");
function nextLesson(){
  const last = S.last && SETS.find(s => s.id === S.last);
  return (last && !setDone(last)) ? last : (SETS.find(s => !setDone(s)) || SETS[0]);
}
function viewHome(){
  const tn = todayN(), full = tn >= GOAL, C = 2 * Math.PI * 31, off = C * (1 - Math.min(1, tn / GOAL));
  const nx = nextLesson(), begun = (S.pos[nx.id] || 0) > 0 || nx.words.some(x => S.words[x.w]);
  const n = streak();
  const weak = weakWords();
  const tile = (id, h, ic, name, desc, done, total, extra) => {
    const pct = total ? Math.round(done / total * 100) : 0, complete = total && done === total;
    return `<button class="tile${extra || ""}" style="--h:${h}" data-act="open" data-id="${id}">
      <span class="ic" aria-hidden="true">${ic}</span>
      <span><span class="nm">${esc(name)}</span><span class="ds">${esc(desc)}</span>${extra ? "" : `<span class="pb"><i style="width:${pct}%"></i></span>`}</span>
      <span class="ct${complete ? " done" : ""}">${complete ? ICON.crown : extra ? total : `${done}/${total}`}</span></button>`;
  };
  return `<section class="goal">
    <div class="gtop">
      <div class="ring${full ? " full" : ""}" role="img" aria-label="Hôm nay ${tn} trên ${GOAL} lượt">
        <svg viewBox="0 0 76 76"><circle class="tr" cx="38" cy="38" r="31" fill="none" stroke-width="10"/><circle class="fl" cx="38" cy="38" r="31" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
        <b>${full ? ICON.tick.replace("<svg", '<svg width="34" height="34" style="color:var(--ok)"') : tn}</b>
      </div>
      <div><h3>${full ? "Đạt mục tiêu hôm nay!" : "Mục tiêu hôm nay"}</h3>
        <p>${tn}/${GOAL} lượt luyện${n ? ` · chuỗi ${n} ngày` : ""}</p>
        <p>${full ? "Luyện thêm để giữ phong độ nhé." : "Mỗi lần chấm một từ hoặc làm một câu luyện tai là một lượt."}</p></div>
    </div>
    <button class="b3 wide" data-act="open" data-id="${nx.id}">${ICON.play}<span>${begun ? "Học tiếp" : "Bắt đầu"}: ${esc(nx.name)}</span></button>
  </section>
  <h2 class="sec">Bài luyện</h2>
  <div class="tiles">
    ${weak.length ? tile("review", 70, ICON.rotate, "Ôn lại từ chưa chuẩn", weak.slice(0,6).map(x => x.w).join(" · "), 0, weak.length, " review") : ""}
    ${SETS.map(s => tile(s.id, SET_UI[s.id].h, esc(SET_UI[s.id].ic), s.name, s.desc, s.words.filter(x => status(x.w) === "ok").length, s.words.length)).join("")}
  </div>`;
}

/* ---------- Bài luyện ---------- */
function currentSet(){
  if (st.set === "review") return {id:"review", name:"Ôn lại", intro:"Những từ lần gần nhất chưa chuẩn. Đọc đúng là từ rời khỏi danh sách.", words:st.review, sentences:[]};
  return SETS.find(s => s.id === st.set);
}
function badgeHTML(w){
  const sb = status(w);
  return sb === "ok" ? `<span class="badge ok">${ICON.star}Đã thuộc</span>` : sb === "weak" ? '<span class="badge weak">Cần ôn</span>' : '<span class="badge new">Từ mới</span>';
}
function fbar(pct, right, closeLabel, act){
  return `<div class="fbar"><button class="x" data-act="${act || "home"}" aria-label="${closeLabel || "Thoát bài"}">${ICON.x}</button>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${Math.max(3, pct)}%"></i></div>${right}</div>`;
}
function viewLesson(){
  const set = currentSet();
  if (!set || !set.words.length) { st.set = null; return viewHome(); }
  if (st.phase === "done") return viewDone(set);
  if (st.phase === "sent") return viewSentences(set);
  st.i = Math.min(st.i, set.words.length-1);
  const x = set.words[st.i], n = set.words.length;
  REG.w = {text:x.w, item:x, url:REG.w && REG.w.text === x.w ? REG.w.url : null};
  const pairBtn = (w, label) => `<button class="wbtn" data-act="say-word" data-t="${esc(w)}">${ICON.play}${esc(label || w)}${IPA[w] ? ` <span class="ip">/${esc(IPA[w])}/</span>` : ""}</button>`;
  const contrast = x.pair ? `<div class="pair"><span>Đối lập với</span>${pairBtn(x.pair)}<button class="wbtn" data-act="say-pair" data-a="${esc(x.w)}" data-b="${esc(x.pair)}">${ICON.play}Nghe cả hai</button></div>`
    : x.base ? `<div class="pair"><span>So với gốc</span>${pairBtn(x.base)}<button class="wbtn" data-act="say-pair" data-a="${esc(x.base)}" data-b="${esc(x.w)}">${ICON.play}Nghe cả hai</button></div>` : "";
  return fbar(st.i / n * 100, `<span class="cnt">${st.i+1}/${n}</span>`) + `

  <article class="card pop" id="entry" aria-label="Từ ${esc(x.w)}">

}
function stepsHTML(){
  const labels = CAN_CHECK ? ["Nghe mẫu","Đọc to","Xem kết quả"] : CAN_MIC ? ["Nghe mẫu","Ghi âm","Tự chấm"] : null;
  if (!labels) return "";
  const cur = st.heard ? 1 : 0;
  return `<ol class="steps" aria-label="Các bước">${labels.map((l, k) => `<li class="${k < cur ? "dn" : k === cur ? "on" : ""}"><span>${k < cur ? "✓" : k+1}</span>${l}</li>`).join("")}</ol>`;
}
function lessonFoot(){
  const set = currentSet(), last = st.i === set.words.length-1, fb = st.fb;
  const sq = (act, icon, label, extra) => `<button class="b3 ghost sq${extra || ""}" data-act="${act}" data-key="w" aria-label="${label}">${icon}<span>${label}</span></button>`;
  const skip = `<button class="b3 ghost sq" data-act="next" aria-label="${last ? "Kết thúc bài" : "Bỏ qua, sang từ tiếp"}">${ICON.next}<span>Bỏ qua</span></button>`;
  const nextLabel = last ? "Hoàn thành bài" : "Tiếp tục";
  if (fb) {
    const msg = `<div class="fbm" role="status"><span class="fi">${fb.cls === "ok" ? ICON.tick : ICON.bang}</span><div><b>${fb.title}</b>${fb.body ? `<p>${fb.body}</p>` : ""}${fb.heard != null ? `<p>Máy nghe: <span class="heard">“${esc(fb.heard)}”</span></p>` : ""}</div></div>`;
    if (fb.cls === "ok" || !CAN_CHECK) return msg + `<div class="acts"><button class="b3 ${fb.cls} main" data-act="next"><span>${nextLabel}</span></button></div>`;
    return msg + `<div class="acts"><button class="b3 ${fb.cls} main" data-act="check" data-key="w">${ICON.mic}<span>Thử lại</span></button>${skip}</div>`;
  }
  let left = "", main;
  if (!st.heard) main = `<button class="b3 main" data-act="say" data-key="w">${ICON.speaker}<span>Nghe mẫu</span></button>`;
  else if (CAN_CHECK) main = `<button class="b3 main" data-act="check" data-key="w">${ICON.mic}<span>Đọc to<span class="xl"> để chấm</span></span></button>`;
  else if (CAN_MIC) main = `<button class="b3 main" data-act="rec" data-key="w">${ICON.mic}<span>Ghi âm giọng bạn</span></button>`;
  else main = `<button class="b3 main" data-act="next"><span>${nextLabel}</span></button>`;
  if (CAN_CHECK && CAN_MIC) left = sq("rec", ICON.mic.replace("<svg", '<svg style="opacity:.75"'), "Ghi âm để tự nghe lại");
  else if (!CAN_MIC && !CAN_CHECK) left = sq("check", ICON.lock, "Ghi âm và chấm (cần Safari)", " locked");
  return stepsHTML() + `<div class="acts">${left}${main}${skip}</div>`;
}

function refreshBadge(w){

}
function speakWord(){
  const set = currentSet(); if (!set || !set.words[st.i]) return;
  say(set.words[st.i].w); st.heard = true; renderFoot();
}
function go(delta){
  const set = currentSet(); if (!set) return;
  const ni = st.i + delta; if (ni < 0) return;
  if (recState) stopRec();
  st.fb = null;
  if (ni >= set.words.length) {
    st.phase = "done"; if (st.set !== "review") { S.pos[st.set] = 0; save(); }
    render(); window.scrollTo(0,0); sfx("done"); confetti(); return;
  }
  st.i = ni; if (st.set !== "review") { S.pos[st.set] = st.i; save(); }
  st.heard = false; render(); window.scrollTo(0,0); speakWord();
}
function showFeedback(fb){
  st.sess.t++; if (fb.cls === "ok") st.sess.ok++;

/* ---------- Luyện tai ---------- */
function quizPool(){
  const seen = new Set(), out = [];
  ALL.forEach(x => { const o = x.pair || x.base; if (!o) return; const k = [x.w,o].sort().join("|"); if (seen.has(k)) return; seen.add(k); out.push([x.w,o]); });
  return out;
}
function newRound(){
  const pair = Q.items[Q.i]; const ans = pair[Math.random() < .5 ? 0 : 1];
  Q.cur = {opts: shuffle(pair.slice()), ans}; Q.answered = false; Q.picked = null;
}
function viewQuiz(){
  if (!Q.on) {

    return `<div class="hero">
      <div class="medal pri">${ICON.ear}</div>

      <p>Máy đọc một trong hai từ chỉ khác nhau ở âm cuối. Chọn đúng từ bạn nghe. Tai phân biệt được thì miệng mới đọc đúng.</p>
      <div class="stats two"><div style="--c:var(--ok-deep)"><span>Tỉ lệ đúng</span><b>${acc}</b></div><div style="--c:var(--pri)"><span>Câu đã làm</span><b>${S.quiz.t}</b></div></div>
      ${misses.length ? `<p class="muted">Hay nhầm nhất, bấm để nghe lại:</p><div class="miss">${misses.map(m => { const [a,b] = m[0].split("|"); return `<button class="wbtn" data-act="say-pair" data-a="${esc(a)}" data-b="${esc(b)}">${ICON.play}${esc(a)} – ${esc(b)}</button>`; }).join("")}</div>` : ""}
      <div class="btns"><button class="b3 wide" data-act="quiz-start">${ICON.play}<span>Bắt đầu 10 câu</span></button></div>
    </div>`;
  }
  if (Q.i >= Q.n) {
    const msg = Q.score >= 9 ? "Tai rất tốt! Giờ luyện nói các cặp này ở mục Học." : Q.score >= 7 ? "Khá ổn. Nghe lại vài lần các cặp còn nhầm." : "Nghe chậm và so sánh từng cặp ở mục Học trước, rồi quay lại nhé.";
    return fbar(100, `<span class="cnt">${Q.n}/${Q.n}</span>`, "Thoát", "quiz-exit") + `<div class="hero">
      <div class="medal pop">${ICON.trophy}</div>
      <h2>${Q.score}/${Q.n} câu đúng</h2><p>${msg}</p>
      <div class="btns"><button class="b3 wide" data-act="quiz-start">${ICON.rotate}<span>Làm thêm 10 câu</span></button><button class="linkish" data-act="quiz-exit">Xong</button></div>
    </div>`;
  }
  const c = Q.cur;
  const choice = w => {
    let cls = ""; if (Q.answered) cls = w === c.ans ? " right" : (w === Q.picked ? " wrong" : " dim");
    return `<button class="choice${cls}" data-act="pick" data-v="${esc(w)}" ${Q.answered ? "disabled" : ""}><span class="cw">${esc(w)}</span><span class="ci">${IPA[w] ? "/"+esc(IPA[w])+"/" : "&nbsp;"}</span></button>`;
  };
  return fbar((Q.i + (Q.answered ? 1 : 0)) / Q.n * 100, `<span class="cnt">${Q.i+1}/${Q.n}</span>`, "Thoát luyện tai", "quiz-exit") + `

    <div class="choices">${c.opts.map(choice).join("")}</div>
    ${Q.answered ? `<div class="pair"><span>Nghe lại:</span>${c.opts.map(w => `<button class="wbtn" data-act="say-word" data-t="${esc(w)}">${ICON.play}${esc(w)}</button>`).join("")}</div>` : `<p class="swipe-hint" style="margin-top:4px">Bấm loa để nghe lại bao nhiêu lần cũng được</p>`}`;
}
function quizFoot(){
  const ok = Q.picked === Q.cur.ans;
  return `<div class="fbm" role="status"><span class="fi">${ok ? ICON.tick : ICON.bang}</span><div><b>${ok ? praise() : "Chưa đúng"}</b><p>${ok ? `Đó là “${esc(Q.cur.ans)}”.` : `Máy đọc “${esc(Q.cur.ans)}”, bạn chọn “${esc(Q.picked)}”.`}</p></div></div>
    <div class="acts"><button class="b3 ${ok ? "ok" : "bad"} main" data-act="quiz-next"><span>${Q.i === Q.n-1 ? "Xem kết quả" : "Tiếp tục"}</span></button></div>`;
}

/* ---------- Vẽ màn hình ---------- */
function renderFoot(slide){
  const f = $("#foot"); let html = "", cls = "";
  if (st.tab === "practice" && st.set && st.phase === "word" && currentSet()) { html = lessonFoot(); cls = st.fb ? " fb-" + st.fb.cls : ""; }
  else if (st.tab === "quiz" && Q.on && Q.i < Q.n && Q.answered) { html = quizFoot(); cls = " fb-" + (Q.picked === Q.cur.ans ? "ok" : "bad"); }
  f.hidden = !html; f.className = "foot" + cls + (slide ? " slide" : "");
  f.innerHTML = html ? `<div class="in">${html}</div>` : "";
  setFootH();
}
function setFootH(){ const f = $("#foot"); document.body.style.setProperty("--footh", f.hidden ? "0px" : f.offsetHeight + "px"); }
function render(){
  if (recState) stopRec(); stopRecog();
  document.querySelectorAll(".tabs button").forEach(b => { if (b.dataset.tab === st.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.body.classList.toggle("focus", (st.tab === "practice" && !!st.set) || (st.tab === "quiz" && Q.on));
  let html;
  if (st.tab === "practice") html = st.set ? viewLesson() : viewHome();
  else if (st.tab === "quiz") html = viewQuiz();
  else if (st.tab === "free") html = viewFree();
  else html = viewRules();
  $("#view").innerHTML = html;
  renderNotice(); renderFoot();
  const ft = $("#free-text"); if (ft) ft.addEventListener("input", () => { S.free = ft.value; save(); });
}
function openSettings(on){
  $("#settings").hidden = !on; $("#scrim").hidden = !on;
  $("#settings-btn").setAttribute("aria-expanded", String(on));
  if (on) { loadVoices(); const c = $("#settings .x"); if (c) c.focus(); } else $("#settings-btn").focus();
}

/* ---------- Sự kiện ---------- */
document.addEventListener("pointerdown", fxUnlock, {capture:true, passive:true});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#settings").hidden) openSettings(false); });
window.addEventListener("resize", setFootH);
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { st.tab = tab.dataset.tab; if (st.tab === "practice") st.set = null; render(); window.scrollTo(0,0); return; }
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, key = b.dataset.key, r = key && REG[key];
  const textOf = () => key === "free" ? ($("#free-text").value || "").trim() : r && r.text;
  if (b.classList.contains("locked")) { setRes(key, lockedMsg(a)); return; }
  switch (a) {
    case "sopen": {
      const k = b.dataset.k, open = b.getAttribute("aria-expanded") !== "true";
      if (recState && recState.key !== "s"+k) stopRec(); stopRecog();
      document.querySelectorAll(".sitem").forEach(li => {
        const on = open && li.id === "si-"+k;
        li.classList.toggle("open", on); li.querySelector(".stext").setAttribute("aria-expanded", String(on)); li.querySelector(".sbody").hidden = !on;
      });
      break;
    }
    case "settings": openSettings(true); break;
    case "settings-close": openSettings(false); break;
    case "say-test": {
      const d = $("#tts-diag"); if (d) { d.hidden = false; d.textContent = "Đang thử…"; }
      say("She asked for six desks and laughed.").then(() => {
        if (!d) return;
        d.innerHTML = lastStarted
          ? "Safari đã đọc xong câu mẫu. Nếu bạn vẫn không nghe gì: bấm nút tăng âm lượng bên hông máy khi đang đọc, kiểm tra tai nghe Bluetooth chưa kết nối, rồi thử chọn giọng khác ở trên."
          : "Safari chưa phát được giọng đọc. Tải lại trang rồi bấm Nghe thử lần nữa. Nếu vẫn vậy: Cài đặt → Trợ năng → Nội dung được đọc → Giọng nói → English, tải một giọng.";
      });
      break;
    }
    case "reset-ask": $("#reset-zone").innerHTML = '<span class="muted">Xóa hết tiến độ?</span> <button class="pill danger" data-act="reset-yes">Xóa</button> <button class="pill" data-act="reset-no">Thôi</button>'; break;
    case "reset-no": $("#reset-zone").innerHTML = '<button class="pill danger" data-act="reset-ask">Xóa tiến độ</button>'; break;
    case "reset-yes": S.words = {}; S.days = []; S.quiz = {t:0,c:0}; S.miss = {}; S.pos = {}; S.today = null; S.last = null; save(); updateHeader(); $("#reset-zone").innerHTML = '<span class="muted">Đã xóa tiến độ.</span>'; render(); break;
    case "hide-notice": S[b.dataset.v] = true; save(); renderNotice(); break;
    case "toast-close": $("#toast").hidden = true; break;
    case "open": {
      const id = b.dataset.id;
      if (id === "review") st.review = weakWords(); else S.last = id;
      st.set = id; st.i = id === "review" ? 0 : (S.pos[id] || 0); st.phase = "word"; st.fb = null; st.heard = false; st.sess = {ok:0, t:0};
      save(); render(); window.scrollTo(0,0); speakWord(); break;
    }
    case "home": st.set = null; st.fb = null; render(); window.scrollTo(0,0); break;
    case "prev": go(-1); break;
    case "next": go(1); break;
    case "sentences": st.phase = "sent"; st.fb = null; render(); window.scrollTo(0,0); break;
    case "sent-back": st.phase = "word"; render(); window.scrollTo(0,0); break;
    case "restart": st.i = 0; st.phase = "word"; st.fb = null; st.heard = false; st.sess = {ok:0, t:0}; if (st.set !== "review") { S.pos[st.set] = 0; save(); } render(); window.scrollTo(0,0); speakWord(); break;
    case "say": case "slow":
      if (recState) stopRec();
      say(textOf(), a === "slow" ? slowRate() : undefined);
      if (key === "w" && !st.heard) { st.heard = true; if (!st.fb) renderFoot(); }
      break;
    case "say-word": say(b.dataset.t); break;
    case "say-pair": say(b.dataset.a).then(() => new Promise(res => setTimeout(res, 450))).then(() => say(b.dataset.b)); break;
    case "rec": if (key === "free" && r) r.text = textOf(); toggleRec(key); break;
    case "check": if (key === "w" && st.fb) { st.fb = null; renderFoot(); } check(key); break;
    case "compare": { const au = document.getElementById("aud-"+key); say(textOf()).then(() => { if (au) { au.currentTime = 0; au.play().catch(()=>{}); } }); break; }
    case "rate": if (r && r.item) {
      const ok = b.dataset.v === "1";
      mark(r.item.w, ok); refreshBadge(r.item.w); b.parentElement.innerHTML = '<span>Đã lưu kết quả tự chấm.</span>';
      if (key === "w") showFeedback(ok ? {cls:"ok", title:praise(), body:"Bạn tự chấm là chuẩn."} : {cls:"warn", title:"Luyện thêm chút nữa", body:esc(TIPS[r.item.t] || "")});
    } break;
    case "sample": { const t = SAMPLES[+b.dataset.k]; $("#free-text").value = t; S.free = t; save(); setRes("free",""); say(t); break; }
    case "quiz-start": Q.on = true; Q.i = 0; Q.score = 0; Q.items = shuffle(quizPool()).slice(0, Q.n); newRound(); render(); window.scrollTo(0,0); say(Q.cur.ans); break;
    case "quiz-exit": Q.on = false; render(); window.scrollTo(0,0); break;
    case "quiz-play": say(Q.cur.ans); break;
    case "quiz-slow": say(Q.cur.ans, slowRate()); break;
    case "pick": {
      if (Q.answered) break;
      Q.answered = true; Q.picked = b.dataset.v; const ok = Q.picked === Q.cur.ans;
      if (ok) Q.score++; else { const k = Q.cur.opts.slice().sort().join("|"); S.miss[k] = (S.miss[k] || 0) + 1; }
      S.quiz.t++; if (ok) S.quiz.c++; touchDay(); save(); updateHeader();
      render(); renderFoot(true); sfx(ok ? "ok" : "bad"); break;
    }
    case "quiz-next":
      Q.i++;
      if (Q.i < Q.n) { newRound(); render(); say(Q.cur.ans); }
      else { render(); window.scrollTo(0,0); sfx("done"); if (Q.score >= 7) confetti(); }
      break;
  }
});

/* Vuốt ngang trên thẻ từ để đổi từ */
let sw = null;
document.addEventListener("touchstart", e => { if (!e.target.closest("#entry") || e.touches.length !== 1) { sw = null; return; } const t = e.touches[0]; sw = {x:t.clientX, y:t.clientY, t:Date.now()}; }, {passive:true});
document.addEventListener("touchend", e => {
  if (!sw) return; const t = e.changedTouches[0]; const dx = t.clientX - sw.x, dy = t.clientY - sw.y, dt = Date.now() - sw.t; sw = null;
  if (Math.abs(dx) > 56 && Math.abs(dy) < Math.abs(dx) * 0.6 && dt < 700) { if (!S.swiped) { S.swiped = true; save(); } go(dx < 0 ? 1 : -1); }
}, {passive:true});

$("#rate").value = S.rate; $("#rate-val").textContent = S.rate.toFixed(2).replace(/0$/,"");
$("#rate").addEventListener("input", e => { S.rate = +e.target.value; $("#rate-val").textContent = S.rate.toFixed(2).replace(/0$/,""); save(); });
$("#voice").addEventListener("change", e => { S.voice = e.target.value; save(); });
$("#sfx").checked = S.sfx;
$("#sfx").addEventListener("change", e => { S.sfx = e.target.checked; save(); if (S.sfx) { fxUnlock(); sfx("ok"); } });

updateHeader(); render();
})();
</script>
